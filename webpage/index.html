<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Key Configurator</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 50px; background-color: #1e1e1e; color: #fff; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        .keys { display: flex; gap: 20px; justify-content: center; margin: 30px 0; }
        
        .key-config { 
            display: flex; flex-direction: column; align-items: center; gap: 10px; 
            background: #3a3a3a; padding: 20px; border-radius: 8px; border: 2px solid transparent;
            transition: all 0.1s;
            width: 150px;
        }
        .key-config.pressed {
            background: #5a5a5a;
            border: 2px solid #0078D4;
            transform: scale(0.95);
        }

        .controls { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        select { padding: 5px; background: #2d2d2d; color: white; border: 1px solid #555; border-radius: 4px; }
        
        .toggle-wrapper { display: flex; justify-content: center; width: 100%; }
        .toggle-label { font-size: 13px; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
        
        /* NEW: Styling for the tooltip info icon */
        .tooltip-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #666;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 14px;
            font-size: 10px;
            font-weight: bold;
        }
        .toggle-label:hover .tooltip-icon {
            background: #0078D4; /* Highlights blue when hovered */
        }

        .general-controls { margin-top: 10px; padding: 20px; background: #3a3a3a; border-radius: 8px; display: flex; justify-content: space-around; align-items: center; gap: 20px; }
        .control-group { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 45%; }
        
        input[type="range"] { width: 100%; cursor: pointer; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #0078D4; color: white; border: none; border-radius: 6px; }
        button:hover { background: #005a9e; }
        button:disabled { background: #555; cursor: not-allowed; }
        input[type="color"] { border: none; width: 50px; height: 50px; cursor: pointer; background: transparent; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="container">
        <h2>3Key Macropad Configurator</h2>
        <button id="connectBtn">Connect</button>
        <p id="status">Status: Disconnected</p>

        <div class="keys">
            <div class="key-config" id="key-ui-0">
                <label>Key 1 (GP14)</label>
                <input type="color" id="color0" value="#000000" disabled>
                <div class="controls">
                    <select id="type0" class="type-select" data-index="0" disabled>
                        <option value="0">Footpad</option>
                        <option value="1">Keyboard</option>
                        <option value="2">Mouse</option>
                    </select>
                    <select id="action0" class="action-select" data-index="0" disabled></select>
                    
                    <div class="toggle-wrapper" id="toggle-wrap-0">
                        <label class="toggle-label" title="When enabled, one physical press locks the action down, and the next press releases it.">
                            <input type="checkbox" id="toggle0" disabled> Toggle Mode <span class="tooltip-icon">?</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="key-config" id="key-ui-1">
                <label>Key 2 (GP13)</label>
                <input type="color" id="color1" value="#000000" disabled>
                <div class="controls">
                    <select id="type1" class="type-select" data-index="1" disabled>
                        <option value="0">Footpad</option>
                        <option value="1">Keyboard</option>
                        <option value="2">Mouse</option>
                    </select>
                    <select id="action1" class="action-select" data-index="1" disabled></select>
                    
                    <div class="toggle-wrapper" id="toggle-wrap-1">
                        <label class="toggle-label" title="When enabled, one physical press locks the action down, and the next press releases it.">
                            <input type="checkbox" id="toggle1" disabled> Toggle Mode <span class="tooltip-icon">?</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="key-config" id="key-ui-2">
                <label>Key 3 (GP12)</label>
                <input type="color" id="color2" value="#000000" disabled>
                <div class="controls">
                    <select id="type2" class="type-select" data-index="2" disabled>
                        <option value="0">Footpad</option>
                        <option value="1">Keyboard</option>
                        <option value="2">Mouse</option>
                    </select>
                    <select id="action2" class="action-select" data-index="2" disabled></select>
                    
                    <div class="toggle-wrapper" id="toggle-wrap-2">
                        <label class="toggle-label" title="When enabled, one physical press locks the action down, and the next press releases it.">
                            <input type="checkbox" id="toggle2" disabled> Toggle Mode <span class="tooltip-icon">?</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="general-controls">
            <div class="control-group">
                <label>Master Brightness</label>
                <input type="range" id="brightnessSlider" min="0" max="255" value="230" disabled>
            </div>
            <div class="control-group">
                <label>LED Behavior</label>
                <select id="ledMode" disabled>
                    <option value="0">Reactive (Press Only)</option>
                    <option value="1">Always On</option>
                    <option value="2">Inverse (Off when pressed)</option>
                    <option value="3">Always Off</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const actionMap = {
            0: [ 
                { name: "Left Pedal", value: 1 }, { name: "Right Pedal", value: 2 }, { name: "Middle Pedal", value: 4 }
            ],
            1: [ 
                { name: "A", value: 4 }, { name: "B", value: 5 }, { name: "C", value: 6 },
                { name: "D", value: 7 }, { name: "E", value: 8 }, { name: "F", value: 9 },
                { name: "W", value: 26 }, { name: "S", value: 22 }, 
                { name: "Enter", value: 40 }, { name: "Escape", value: 41 },
                { name: "Backspace", value: 42 }, { name: "Tab", value: 43 },
                { name: "Spacebar", value: 44 },
                { name: "Right Arrow", value: 79 }, { name: "Left Arrow", value: 80 },
                { name: "Down Arrow", value: 81 }, { name: "Up Arrow", value: 82 }
            ],
            2: [ 
                { name: "Left Click", value: 1 }, { name: "Right Click", value: 2 }, { name: "Middle Click", value: 4 }
            ]
        };

        let port;
        let writer;
        let reader;
        
        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('status');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const ledModeSelect = document.getElementById('ledMode');
        
        const colorInputs = [document.getElementById('color0'), document.getElementById('color1'), document.getElementById('color2')];
        const typeSelects = [document.getElementById('type0'), document.getElementById('type1'), document.getElementById('type2')];
        const actionSelects = [document.getElementById('action0'), document.getElementById('action1'), document.getElementById('action2')];
        const toggleInputs = [document.getElementById('toggle0'), document.getElementById('toggle1'), document.getElementById('toggle2')];
        const toggleWraps = [document.getElementById('toggle-wrap-0'), document.getElementById('toggle-wrap-1'), document.getElementById('toggle-wrap-2')];

        // Handles showing/hiding the toggle checkbox based on device type
        function updateToggleVisibility(index, typeValue) {
            if (typeValue === "0" || typeValue === 0) {
                toggleWraps[index].style.display = 'flex';
            } else {
                toggleWraps[index].style.display = 'none';
            }
        }

        function populateActions(index, typeValue, selectedAction = null) {
            const actionSelect = actionSelects[index];
            actionSelect.innerHTML = ""; 
            
            const options = actionMap[typeValue] || actionMap[0];
            options.forEach(opt => {
                const el = document.createElement("option");
                el.value = opt.value;
                el.innerText = opt.name;
                actionSelect.appendChild(el);
            });

            if (selectedAction !== null) {
                actionSelect.value = selectedAction;
            }
            
            updateToggleVisibility(index, typeValue);
        }

        // Initialize UI State
        for(let i=0; i<3; i++) {
            populateActions(i, 0); 
            
            typeSelects[i].addEventListener('change', (e) => {
                populateActions(i, e.target.value);
                sendMapUpdate(i);
            });
            actionSelects[i].addEventListener('change', () => {
                sendMapUpdate(i);
            });
        }

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
        }

        // Disconnect Handler: Resets the UI if connection is lost
        function handleDisconnect() {
            console.log("Device disconnected.");
            statusText.innerText = "Status: Disconnected";
            statusText.style.color = "#f44336";
            connectBtn.innerText = "Connect";
            connectBtn.disabled = false;
            
            colorInputs.forEach(i => i.disabled = true);
            typeSelects.forEach(s => s.disabled = true);
            actionSelects.forEach(s => s.disabled = true);
            toggleInputs.forEach(c => c.disabled = true);
            brightnessSlider.disabled = true;
            ledModeSelect.disabled = true;
            
            port = null;
            writer = null;
            reader = null;
        }

        navigator.serial.addEventListener('disconnect', (event) => {
            if (event.target === port) {
                handleDisconnect();
            }
        });

        connectBtn.addEventListener('click', async () => {
            try {
                const usbFilters = [{ usbVendorId: 0x05F3, usbProductId: 0x00FF }];
                port = await navigator.serial.requestPort({ filters: usbFilters });
                await port.open({ baudRate: 115200 }); 

                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                statusText.innerText = "Status: Connected!";
                statusText.style.color = "#4caf50";
                connectBtn.innerText = "Connected";
                connectBtn.disabled = true;

                colorInputs.forEach(i => i.disabled = false);
                typeSelects.forEach(s => s.disabled = false);
                actionSelects.forEach(s => s.disabled = false);
                toggleInputs.forEach(c => c.disabled = false);
                brightnessSlider.disabled = false;
                ledModeSelect.disabled = false;

                await writer.write("SYNC\n");
                readLoop(reader);

            } catch (err) {
                console.error("Connection failed:", err);
                handleDisconnect();
            }
        });

        async function readLoop(reader) {
            let buffer = "";
            while (true) {
                try {
                    const { value, done } = await reader.read();
                    if (value) {
                        buffer += value;
                        let lines = buffer.split('\n');
                        buffer = lines.pop(); 
                        
                        for (let line of lines) {
                            processMacropadMessage(line.trim());
                        }
                    }
                    if (done) {
                        reader.releaseLock();
                        break;
                    }
                } catch (err) {
                    console.error("Serial read error:", err);
                    handleDisconnect();
                    break; 
                }
            }
        }

        function processMacropadMessage(msg) {
            const parts = msg.split(',');
            
            if (parts.length === 2 && parts[0] === 'BRIGHTNESS') {
                brightnessSlider.value = parts[1];
            }
            else if (parts.length === 2 && parts[0] === 'LEDMODE') {
                ledModeSelect.value = parts[1];
            }
            else if (parts.length === 3 && parts[1] === 'TOGGLE') {
                const keyIndex = parseInt(parts[0]);
                const isToggle = parseInt(parts[2]) === 1;
                if (keyIndex >= 0 && keyIndex < toggleInputs.length) {
                    toggleInputs[keyIndex].checked = isToggle;
                }
            }
            else if (parts.length === 2) {
                const keyIndex = parts[0];
                const state = parts[1];
                const keyElement = document.getElementById(`key-ui-${keyIndex}`);
                if (keyElement) {
                    if (state === 'DOWN') keyElement.classList.add('pressed');
                    else if (state === 'UP') keyElement.classList.remove('pressed');
                }
            }
            else if (parts.length === 5 && parts[1] === 'COLOR') {
                const keyIndex = parseInt(parts[0]);
                const hexColor = rgbToHex(parseInt(parts[2]), parseInt(parts[3]), parseInt(parts[4]));
                if (keyIndex >= 0 && keyIndex < colorInputs.length) {
                    colorInputs[keyIndex].value = hexColor;
                }
            }
            else if (parts.length === 4 && parts[1] === 'MAP') {
                const keyIndex = parseInt(parts[0]);
                const mapType = parseInt(parts[2]);
                const mapCode = parseInt(parts[3]);
                
                if (keyIndex >= 0 && keyIndex < typeSelects.length) {
                    typeSelects[keyIndex].value = mapType;
                    populateActions(keyIndex, mapType, mapCode);
                }
            }
        }

        async function sendMapUpdate(keyIndex) {
            if (!writer) return;
            const typeVal = typeSelects[keyIndex].value;
            const actionVal = actionSelects[keyIndex].value;
            const command = `${keyIndex},MAP,${typeVal},${actionVal}\n`;
            try { await writer.write(command); } 
            catch (err) { console.error("Failed to map", err); }
        }

        toggleInputs.forEach((input, index) => {
            input.addEventListener('change', async (event) => {
                if (!writer) return;
                const val = event.target.checked ? 1 : 0;
                try { await writer.write(`${index},TOGGLE,${val}\n`); } 
                catch (err) {}
            });
        });

        brightnessSlider.addEventListener('input', async (event) => {
            if (!writer) return;
            try { await writer.write(`BRIGHTNESS,${event.target.value}\n`); } 
            catch (err) {}
        });

        ledModeSelect.addEventListener('change', async (event) => {
            if (!writer) return;
            try { await writer.write(`LEDMODE,${event.target.value}\n`); } 
            catch (err) {}
        });

        colorInputs.forEach((input, index) => {
            input.addEventListener('input', async (event) => {
                if (!writer) return;
                const hex = event.target.value;
                const r = parseInt(hex.substr(1, 2), 16);
                const g = parseInt(hex.substr(3, 2), 16);
                const b = parseInt(hex.substr(5, 2), 16);
                try { await writer.write(`${index},${r},${g},${b}\n`); } 
                catch (err) {}
            });
        });
    </script>
</body>
</html>
